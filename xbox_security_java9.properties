# Java 9+ security override for the Xbox sandbox (jre17 / jre21 / "current").
# Same intent as xbox_security.properties, which is Java 8-only and must NOT
# be used on modern JREs.
#
# CRITICAL: JDK 15 REMOVED the legacy provider name
# "com.sun.net.ssl.internal.ssl.Provider" (JDK-8240974). Writing that name
# into a JDK 15+ java.security makes SunJSSE fail to register, and EVERY https
# request dies with "java.security.NoSuchAlgorithmException: Default SSLContext
# not available" (skins, session keys, authlib). The modern files use the
# provider names JDK 9+ understands.

security.provider.1=SUN
security.provider.2=SunRsaSign
security.provider.3=SunEC
security.provider.4=SunJSSE
security.provider.5=SunJCE
security.provider.6=SunJGSS
security.provider.7=SunSASL
security.provider.8=XMLDSig
security.provider.9=SunPCSC
security.provider.10=JdkLDAP
security.provider.11=JdkSASL

# Disable FIPS/system detection that requires registry access
fips.provider.1=
fips.provider.2=

jdk.jar.disabledAlgorithms=MD2, MD5, RSA keySize < 1024, DSA keySize < 1024, SHA1 denyAfter 2019-01-01
jdk.certpath.disabledAlgorithms=MD2, MD5
jdk.tls.disabledAlgorithms=SSLv3, RC4, DES, MD5withRSA, DH keySize < 1024

# Avoid security code that probes host system configuration.
security.useSystemPropertiesFile=false
sun.security.krb5.disableReferrals=true

# "jks" with keystore.type.compat=true loads BOTH JKS and PKCS12 stores
# (whatever format the packaged cacerts happens to be); forcing pkcs12 broke
# every HTTPS request against JKS cacerts (DerInputStream.getLength errors).
keystore.type=jks
keystore.type.compat=true
ssl.KeyManagerFactory.algorithm=SunX509
ssl.TrustManagerFactory.algorithm=PKIX
networkaddress.cache.ttl=60
networkaddress.cache.negative.ttl=10

securerandom.source=file:/dev/urandom
securerandom.strongAlgorithms=SHA1PRNG:SUN
