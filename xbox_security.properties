# Java 8 security override for the Xbox sandbox.
# This file is appended to the JRE's master java.security with
# -Djava.security.properties=<path>.
#
# Java 8 expects the provider entries to be provider CLASS names,
# not the provider names used by newer JDKs.

security.provider.1=sun.security.provider.Sun
security.provider.2=sun.security.rsa.SunRsaSign
security.provider.3=sun.security.ec.SunEC
security.provider.4=com.sun.net.ssl.internal.ssl.Provider
security.provider.5=com.sun.crypto.provider.SunJCE
security.provider.6=sun.security.jgss.SunProvider
security.provider.7=com.sun.security.sasl.Provider
security.provider.8=org.jcp.xml.dsig.internal.dom.XMLDSigRI
security.provider.9=sun.security.smartcardio.SunPCSC

# Disable FIPS/system detection that requires registry access
fips.provider.1=
fips.provider.2=

# Keep Forge 1.12.2's legacy certificate path from tripping over the
# repackaged UWP Minecraft jar. SHA-1 MessageDigest itself must remain usable.
jdk.jar.disabledAlgorithms=MD2, MD5, RSA keySize < 1024, DSA keySize < 1024, SHA1 denyAfter 2019-01-01
jdk.certpath.disabledAlgorithms=MD2, MD5
jdk.tls.disabledAlgorithms=SSLv3, RC4, DES, MD5withRSA, DH keySize < 1024

# Avoid security code that probes host system configuration.
security.useSystemPropertiesFile=false
sun.security.krb5.disableReferrals=true

# Trust store: "jks" with keystore.type.compat=true loads BOTH JKS and PKCS12
# stores. Forcing pkcs12 (as older overrides did) broke every HTTPS request
# (skins, session lookup) with DerInputStream.getLength errors on JKS cacerts.
keystore.type=jks
keystore.type.compat=true

# Java 8-compatible SecureRandom configuration.
securerandom.source=file:/dev/urandom
securerandom.strongAlgorithms=SHA1PRNG:SUN

# Java 8 factory default is jks. Forcing pkcs12 (the JDK 21-era default) made
# KeyStore.getInstance("pkcs12") load the JKS-format cacerts of some Java 8
# runtimes with NO fallback -> "DerInputStream.getLength(): lengthTag=109"
# on every https request (skins, session lookup). "jks" with compat=true
# accepts both JKS and PKCS12 stores.
keystore.type=jks
keystore.type.compat=true
ssl.KeyManagerFactory.algorithm=SunX509
ssl.TrustManagerFactory.algorithm=PKIX
networkaddress.cache.ttl=60
networkaddress.cache.negative.ttl=10
