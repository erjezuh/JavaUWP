name: UI preview

# Renders the launcher screens with tools/ui-preview (Direct2D, offscreen) on a
# Windows runner and publishes PNGs. Dispatch only: these are design artifacts,
# not a package build. The selected screens are also committed under
# docs/previews/<subdir> so before/after comparisons can be reviewed in-repo.
# workflow_dispatch only reads workflow files from the repository's default
# branch, so this workflow also runs on pushes to the fork branch. The desired
# destination folder is read from docs/previews/.render (a tiny text file that
# doubles as the render trigger).
on:
  workflow_dispatch:
    inputs:
      subdir:
        description: "Destination folder under docs/previews (e.g. before / after)"
        type: string
        default: ""
      language:
        description: "Language code for the preview (empty = default)"
        type: string
        default: ""
  push:
    branches:
      - arena/16fba603-javauwp
    paths:
      - ".github/workflows/ui-preview.yml"
      - "tools/ui-preview/**"
      - "MC.Xbox/ui/**"
      - "docs/previews/.render"

concurrency:
  group: ui-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    name: Render launcher screens
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Render screens to PNG
        shell: powershell
        env:
          PREVIEW_LANGUAGE: ${{ inputs.language }}
        run: .\tools\ui-preview\render.ps1 -OutDir ui-preview-out -Language $env:PREVIEW_LANGUAGE

      - name: Regenerate en.json from source strings
        shell: pwsh
        run: .\scripts\update-translations.ps1

      - name: Resolve preview destination
        id: destination
        shell: powershell
        env:
          INPUT_SUBDIR: ${{ inputs.subdir }}
        run: |
          $subdir = $env:INPUT_SUBDIR
          if (-not $subdir) {
            $marker = "docs\previews\.render"
            if (Test-Path $marker) { $subdir = (Get-Content $marker -Raw).Trim() }
          }
          if (-not $subdir) { $subdir = "latest" }
          "subdir=$subdir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload all preview PNGs
        uses: actions/upload-artifact@v6
        with:
          name: ui-preview-${{ steps.destination.outputs.subdir }}
          path: ui-preview-out/*.png
          if-no-files-found: error

      - name: Commit selected previews
        shell: powershell
        env:
          PREVIEW_SUBDIR: ${{ steps.destination.outputs.subdir }}
        run: |
          $dest = Join-Path "docs\previews" $env:PREVIEW_SUBDIR
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $names = @(
            "signin-device-code", "main-menu", "main-menu-update",
            "main-menu-sign-out-confirm", "settings-modrinth", "remote-files",
            "crash-summary", "mods-0-profiles", "mods-1-popular",
            "mods-5-resource-packs"
          )
          foreach ($name in $names) {
            $src = Join-Path "ui-preview-out" "$name.png"
            if (-not (Test-Path $src)) { throw "Missing preview $name.png" }
            Copy-Item $src (Join-Path $dest "$name.png") -Force
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "docs/previews/$env:PREVIEW_SUBDIR/*.png" "MC.Xbox/lang/en.json"
          if (git diff --cached --quiet) {
            Write-Host "No preview changes to commit"
          } else {
            git commit -m "UI preview: $env:PREVIEW_SUBDIR screenshots"
            git pull --rebase origin $env:GITHUB_REF_NAME
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          }
