name: Startup telemetry build (validation)

on:
  push:
    branches:
      - feature/startup-telemetry
    paths:
      - ".github/workflows/startup-telemetry-build.yml"
      - "MC.Xbox/**"
      - "glfw_shim/**"
      - "compat_mod/**"
      - "controller_mod/**"
      - "mouse_support/**"
      - "patch/**"
      - "scripts/**"
      - "config/**"
      - "log_configs/**"
      - "mesa-runtime/**"
      - "build.ps1"
      - "xbox_security.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Xbox APPX
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out telemetry branch
        uses: actions/checkout@v5
        with:
          ref: feature/startup-telemetry
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "17"

      - name: Export JDK 17 path
        shell: powershell
        run: |
          "JDK17_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JAVA17_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Export JDK 21 path
        shell: powershell
        run: |
          "JAVA21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JDK21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"

      - name: Clean generated outputs
        shell: powershell
        run: .\\scripts\\clean.ps1 -Apply

      - name: Prepare build cache
        shell: powershell
        run: .\\scripts\\setup.ps1

      - name: Build APPX (validation only)
        shell: powershell
        run: .\\build.ps1 -SkipStopAppProcesses -McVersion 1.21.1 -ReleaseChannel nightly -AppxVersion 1.0.0.2

      - name: Upload compiled APPX
        uses: actions/upload-artifact@v6
        with:
          name: BanditLauncher-startup-telemetry
          path: output/*.appx
          if-no-files-found: error
          retention-days: 14
