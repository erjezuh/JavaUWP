name: Startup telemetry build (validation)

on:
  push:
    branches:
      - feature/startup-telemetry
    paths:
      - ".github/workflows/startup-telemetry-build.yml"
      - "MC.Xbox/**"
      - "glfw_shim/**"
      - "compat_mod/**"
      - "mouse_support/**"
      - "patch/**"
      - "scripts/**"
      - "config/**"
      - "log_configs/**"
      - "mesa-runtime/**"
      - "build.ps1"
      - "xbox_security.properties"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Xbox APPX
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out telemetry branch
        uses: actions/checkout@v5
        with:
          ref: feature/startup-telemetry
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "17"

      - name: Export JDK 17 path
        shell: powershell
        run: |
          "JDK17_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JAVA17_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Export JDK 21 path
        shell: powershell
        run: |
          "JAVA21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JDK21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"

      - name: Clean generated outputs
        shell: powershell
        run: .\\scripts\\clean.ps1 -Apply

      - name: Prepare build cache
        shell: powershell
        run: .\\scripts\\setup.ps1 -MinecraftVersion 1.21.1 -FabricLoaderVersion 0.19.5

      - name: Build APPX (upgrade version)
        shell: powershell
        run: .\\build.ps1 -SkipStopAppProcesses -McVersion 1.21.1 -ReleaseChannel nightly -AppxVersion 1.0.32.0

      - name: Publish APPX as a direct GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: startup-telemetry-${{ github.run_id }}
          name: BanditLauncher startup telemetry 1.0.32.0 #${{ github.run_number }}
          body: |
            Xbox APPX build from branch feature/startup-telemetry.

            Package version: 1.0.32.0 (upgrade over 1.0.31.0).

            Commit: ${{ github.sha }}

            Download the APPX asset below directly.
          files: output/*.appx
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
          generate_release_notes: false
