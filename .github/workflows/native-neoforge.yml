name: Native NeoForge fork build

# Builds the native keyboard/mouse APPX from this fork's branch. Every build
# publishes a downloadable Release (tag nightly-native) with the .appx, its
# .sha256 and the matching .cer, and also attaches the same files to the run.
# Set publish_release=false on a manual dispatch to skip the Release.
# A cold build regenerates 56 manifests and ~50 Java mods; the actions/cache
# restore/save below keeps those stamp-driven outputs between runs.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the downloadable nightly-native Release"
        type: boolean
        default: true
      default_loader_version:
        description: "Optional NeoForge loader version override (defaults to scripts/config.ps1)"
        type: string
        default: ""
      fast_build:
        description: "Quick smoke build: skip the 56 per-version manifests and per-version mods (not published)"
        type: boolean
        default: false
  push:
    branches:
      - arena/16fba603-javauwp
    paths:
      - ".github/workflows/native-neoforge.yml"
      - "MC.Xbox/**"
      - "glfw_shim/**"
      - "compat_mod/**"
      - "controller_mod/**"
      - "patch/**"
      - "scripts/**"
      - "config/**"
      - "build.ps1"
      - "tests/**"

concurrency:
  # A build that is about to publish a Release must not be killed by the next
  # push. Queued runs still see a warm cache, so they are cheap.
  # v2 starts a fresh group so this policy change cannot cancel a build that
  # was already running under the old cancel-in-progress: true group.
  group: native-neoforge-fork-build-v2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checks:
    name: Portable fork checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Run C++ and catalog/config tests
        run: bash tests/run-tests.sh

  build:
    name: Build native NeoForge APPX
    # Docs/preview-only pushes can say [skip appx] in the commit message.
    if: ${{ !contains(github.event.head_commit.message || '', '[skip appx]') }}
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "17"

      - name: Export JDK 17 path
        shell: powershell
        run: |
          "JDK17_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JAVA17_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Export JDK 21 path
        shell: powershell
        run: |
          "JAVA21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JDK21_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"

      - name: Clean generated outputs
        shell: powershell
        run: .\scripts\clean.ps1 -Apply

      # build.ps1 and every per-target mod script already write content-hash
      # stamps next to their outputs. clean.ps1 above deletes staging/build,
      # so restoring these four directories AFTER the clean is what turns a
      # cold 20-minute rebuild into a mostly stamp-hit build. staging/package
      # is deliberately NOT cached: it is the final package content.
      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            staging/cache
            staging/build
            staging/certs
            staging/notes
          key: native-appx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            native-appx-${{ runner.os }}-

      - name: Report cache status
        shell: powershell
        env:
          CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.build-cache.outputs.cache-primary-key }}
          CACHE_MATCHED: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: |
          Write-Host "APPX_BUILD_CACHE_HIT $env:CACHE_HIT (primary $env:CACHE_KEY, restored $env:CACHE_MATCHED)"

      - name: Prepare build cache
        shell: powershell
        run: .\scripts\setup.ps1

      - name: Build native APPX
        shell: powershell
        env:
          DEFAULT_LOADER_VERSION: ${{ inputs.default_loader_version }}
          FAST_BUILD: ${{ inputs.fast_build }}
        run: |
          # The fork defaults to NeoForge 1.21.1; an explicit workflow input can
          # retarget the package to any other version in config/versions.tsv.
          if ($env:DEFAULT_LOADER_VERSION) {
            $row = @(Import-Csv config\versions.tsv -Delimiter "`t" | Where-Object {
              $_.loader -eq "neoforge" -and $_.loaderVersion -eq $env:DEFAULT_LOADER_VERSION
            })
            if ($row.Count -ne 1) { throw "Unknown NeoForge loader version $env:DEFAULT_LOADER_VERSION" }
            $env:DEFAULT_MC_VERSION = $row[0].minecraftVersion
            $env:DEFAULT_LAUNCH_VERSION = "neoforge-$($row[0].loaderVersion)"
            $env:DEFAULT_JAVA_RUNTIME = $row[0].javaRuntime
            $env:DEFAULT_CONTROLLER_PROVIDER = $row[0].controllerProvider
            $env:MC_VERSION = $row[0].minecraftVersion
          }
          # hashtable splat: switch parameters must be bound by name, not passed
          # as positional strings
          $buildArgs = @{ SkipStopAppProcesses = $true; ReleaseChannel = "nightly-native" }
          if ($env:FAST_BUILD -eq "true") {
            Write-Host "Fast build: skipping per-version manifests and per-version mods"
            $buildArgs.SkipVersionManifests = $true
            $buildArgs.SkipVersionCompat = $true
          }
          .\build.ps1 @buildArgs

      - name: Save build cache
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            staging/cache
            staging/build
            staging/certs
            staging/notes
          key: native-appx-${{ runner.os }}-${{ github.sha }}

      - name: Stage native release assets
        shell: powershell
        run: |
          $appx = Get-ChildItem output\BanditLauncherNative_*.appx | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $appx) { throw "No native APPX produced" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $appx.FullName dist\BanditLauncherNative-neoforge.appx -Force
          $hash = Get-FileHash dist\BanditLauncherNative-neoforge.appx -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  BanditLauncherNative-neoforge.appx" | Set-Content -Path dist\BanditLauncherNative-neoforge.sha256 -Encoding ascii
          $signature = Get-AuthenticodeSignature dist\BanditLauncherNative-neoforge.appx
          if (-not $signature.SignerCertificate) { throw "APPX signing certificate missing" }
          Export-Certificate -Cert $signature.SignerCertificate -FilePath dist\BanditLauncherNative-neoforge.cer -Force | Out-Null
          "APPX_VERSION=$($appx.BaseName -replace '^BanditLauncherNative_', '')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate packaged targets
        # A single upstream target that fails to generate a manifest is recorded
        # as a build warning by build.ps1; report it here without failing the
        # whole nightly artifact.
        continue-on-error: true
        shell: powershell
        run: .\scripts\validate-modern-version-matrix.ps1 -AppxPath dist\BanditLauncherNative-neoforge.appx

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: BanditLauncherNative-neoforge
          path: |
            dist/BanditLauncherNative-neoforge.appx
            dist/BanditLauncherNative-neoforge.sha256
            dist/BanditLauncherNative-neoforge.cer
          if-no-files-found: error

      - name: Publish nightly-native release
        id: publish-release
        if: ${{ (github.event_name == 'push' || inputs.publish_release == true) && inputs.fast_build != true }}
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\scripts\publish-release.ps1 `
            -Channel nightly-native `
            -Sha $env:GITHUB_SHA `
            -AppxVersion $env:APPX_VERSION `
            -RunUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" `
            -Asset dist\BanditLauncherNative-neoforge.appx, dist\BanditLauncherNative-neoforge.sha256, dist\BanditLauncherNative-neoforge.cer

      # Safety net: the APPX artifact is already uploaded at this point. If the
      # Release API refuses the publish, ask the recovery workflow to attach
      # that same artifact to the Release. No rebuild, and "every build always
      # leaves a downloadable APPX" still holds.
      - name: Trigger APPX recovery from artifact
        if: ${{ failure() && steps.publish-release.outcome == 'failure' && (github.event_name == 'push' || inputs.publish_release == true) && inputs.fast_build != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p docs/ci
          echo "$GITHUB_RUN_ID" > docs/ci/.publish-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/ci/.publish-trigger
          if ! git diff --cached --quiet; then
            git commit -m "CI: recover APPX Release from run $GITHUB_RUN_ID"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Print download link
        if: ${{ always() && (github.event_name == 'push' || inputs.publish_release == true) && inputs.fast_build != true }}
        shell: powershell
        run: |
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/nightly-native"
          Write-Host "APPX_RELEASE_URL $url"
          "## Descarga del APPX`n`n$url" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
