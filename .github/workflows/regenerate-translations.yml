name: Regenerate translation dictionaries (temporary)

on:
  push:
    branches:
      - arena/16fba603-javauwp
    paths:
      - "docs/ci/.translations-trigger"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Regenerate en.json and fill missing translations
        shell: pwsh
        run: .\scripts\update-translations.ps1 -Fill
      - name: Verify dictionaries
        shell: pwsh
        run: .\scripts\update-translations.ps1 -Check
      - name: Commit regenerated dictionaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f MC.Xbox/lang/en.json MC.Xbox/lang/es-419.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate translation dictionaries for Controlify [skip appx]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
