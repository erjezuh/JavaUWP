name: Inspect packaged download manifest

# Temporary diagnostic: extract the exact manifest rows packaged into the
# built APPX so a failing download can be traced to its URL and SHA1.
on:
  push:
    branches:
      - arena/16fba603-javauwp
    paths:
      - "docs/ci/.inspect-trigger"

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Extract manifest rows
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(tr -d '[:space:]' < docs/ci/.inspect-trigger)
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name=="BanditLauncherNative-neoforge") | .id' | head -1)
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/a.zip
          rm -rf /tmp/a && mkdir -p /tmp/a
          unzip -o -q /tmp/a.zip -d /tmp/a
          APPX=$(find /tmp/a -name "*.appx" | head -1)
          unzip -p "$APPX" download_manifest.tsv > /tmp/manifest.tsv
          {
            echo "# Packaged manifest diagnostics"; echo
            echo "Run: $RUN_ID  APPX: $APPX"; echo
            echo "## Total rows"
            grep -vc '^#' /tmp/manifest.tsv
            echo
            echo "## Rows containing listenablefuture"
            grep -n "listenablefuture" /tmp/manifest.tsv
            echo
            echo "## Longest relative paths (length, path)"
            grep -v '^#' /tmp/manifest.tsv \
              | awk -F '\t' '{ print length($1), $1 }' \
              | sort -rn > /tmp/longest.txt
            head -12 /tmp/longest.txt
            echo
            echo "## Does the failing URL actually work?"
            URL=$(grep "listenablefuture" /tmp/manifest.tsv | head -1 | cut -f4 | tr -d '\r')
            echo "URL: $URL"
            curl -sSL -o /tmp/listenablefuture.jar \
              -w "http=%{http_code} bytes=%{size_download} redirects=%{num_redirects}\n" \
              "$URL" || echo "curl failed"
            sha1sum /tmp/listenablefuture.jar || echo "no file downloaded"
            echo
            echo "## Expected sha1 / size from manifest"
            grep "listenablefuture" /tmp/manifest.tsv | head -1 | cut -f2,3
            echo
            echo "## Libraries already bundled inside the APPX"
            unzip -Z1 "$APPX" | grep -c "^game/libraries/" || true
            unzip -Z1 "$APPX" | grep "guava" | head -12 || true
            echo
            echo "## Entries at the package root (first 30)"
            unzip -Z1 "$APPX" | grep -v "^game/libraries/" | head -30
          } > docs/ci/manifest-inspect.md 2>&1
          cat docs/ci/manifest-inspect.md
      - name: Save report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/ci/manifest-inspect.md
          if ! git diff --cached --quiet; then
            git commit -m "CI: packaged manifest diagnostics"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
