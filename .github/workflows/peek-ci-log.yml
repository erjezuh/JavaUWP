name: Peek at a failed CI build log

on:
  push:
    branches:
      - arena/16fba603-javauwp
    paths:
      - "docs/ci/.peek-trigger"

permissions:
  contents: write
  actions: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Capture log tail
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(tr -d '[:space:]' < docs/ci/.peek-trigger)
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/full.log 2>&1
          {
            echo "# Failed build log (filtered)"; echo
            echo "Total lines: $(wc -l < /tmp/full.log)"; echo
            echo "## Skipped targets / warnings"
            grep -n -aE "skipped for|WARNING|Strict build|target\(s\) skipped|NeoForge controller 1\.21\.5|NeoForge controller .*failed" /tmp/full.log > /tmp/warns.txt || true
            head -60 /tmp/warns.txt
            echo
            echo "## 1.21.5 neoforge controller context"
            grep -n -a "Building per-version NeoForge controller mod: 1.21.5-neoforge-21.5.98" /tmp/full.log > /tmp/ctx.txt || true
            LINE=$(head -1 /tmp/ctx.txt | cut -d: -f1)
            if [ -n "$LINE" ]; then
              START=$((LINE - 3)); END=$((LINE + 45))
              sed -n "${START},${END}p" /tmp/full.log
            fi
            echo
            echo "## Last 25 lines"
            tail -25 /tmp/full.log
          } > docs/ci/build-failure.md 2>&1
          tail -60 docs/ci/build-failure.md
      - name: Save
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/ci/build-failure.md
          if ! git diff --cached --quiet; then
            git commit -m "CI: failed build log"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
