name: Peek at a failed CI build log (temporary)

on:
  push:
    branches:
      - arena/16fba603-javauwp
    paths:
      - "docs/ci/.peek-trigger"

permissions:
  contents: write
  actions: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Capture failed log
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(tr -d '[:space:]' < docs/ci/.peek-trigger)
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed.log 2>&1 || true
          {
            echo "# Failed build log"; echo
            echo "Total lines: $(wc -l < /tmp/failed.log)"; echo
            echo "## Last 90 lines"; tail -90 /tmp/failed.log
          } > docs/ci/failed-build.md 2>&1
          tail -60 docs/ci/failed-build.md
      - name: Save
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/ci/failed-build.md
          if ! git diff --cached --quiet; then
            git commit -m "CI: failed build log [skip appx]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
