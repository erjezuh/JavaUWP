name: Peek at a failed CI build log

on:
  push:
    branches:
      - arena/16fba603-javauwp
    paths:
      - "docs/ci/.peek-trigger"

permissions:
  contents: write
  actions: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Capture log tail
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(tr -d '[:space:]' < docs/ci/.peek-trigger)
          {
            echo "# Failed build log"; echo
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 \
              | tail -c 120000
          } > docs/ci/build-failure.md 2>&1
          tail -40 docs/ci/build-failure.md
      - name: Save
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/ci/build-failure.md
          if ! git diff --cached --quiet; then
            git commit -m "CI: failed build log"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
