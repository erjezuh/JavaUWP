name: Peek at a failed CI build log

on:
  push:
    branches:
      - arena/16fba603-javauwp
    paths:
      - "docs/ci/.peek-trigger"

permissions:
  contents: write
  actions: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Capture log tail
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(tr -d '[:space:]' < docs/ci/.peek-trigger)
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/full.log 2>&1
          {
            echo "# Failed build log (filtered)"; echo
            echo "Total lines: $(wc -l < /tmp/full.log)"; echo
            echo "## 1.21.5 / controller / failure lines"
            grep -n -iE "1\.21\.5|controller|build failure|exception|failed|missing or invalid" /tmp/full.log \
              | grep -viE "proprietary API|^\s*\^" | head -120
            echo
            echo "## Build failure summary lines"
            grep -n -iE "Add-BuildFailure|Strict build|BuildFailures|WARNING" /tmp/full.log | head -60
            echo
            echo "## Last 25 lines"
            tail -25 /tmp/full.log
          } > docs/ci/build-failure.md 2>&1
          tail -60 docs/ci/build-failure.md
      - name: Save
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/ci/build-failure.md
          if ! git diff --cached --quiet; then
            git commit -m "CI: failed build log"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
