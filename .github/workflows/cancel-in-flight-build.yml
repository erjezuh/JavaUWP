name: Cancel in-flight APPX build (temporary)

on:
  push:
    branches:
      - arena/16fba603-javauwp
    paths:
      - "docs/ci/.cancel-trigger"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel run 41450203004
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          gh run cancel 41450203004 --repo "$GITHUB_REPOSITORY" || \
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/41450203004/cancel"
          gh run view 41450203004 --repo "$GITHUB_REPOSITORY" | head -8
